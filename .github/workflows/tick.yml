name: tick
# Wakes the reminder sender. URL and key live in Actions secrets, not here.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick
        env:
          URL: ${{ secrets.TICK_URL }}
          KEY: ${{ secrets.TICK_KEY }}
        run: curl -fsS --retry 2 --max-time 25 -H "x-tick-key: $KEY" "$URL" -o /dev/null -w "%{http_code}\n"
      # GitHub switches off schedules in a public repo with no activity for 60 days; re-enabling about once a day keeps it on
      - name: Keep the schedule on
        if: github.event_name == 'schedule' && github.run_number % 144 == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/tick.yml/enable"
